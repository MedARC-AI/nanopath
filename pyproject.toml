[project]
name = "nanopath"
version = "0.1.0"
description = "nanopath dependencies"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
  "torch==2.14.0+cu130",
  "torchvision==0.29.0+cu130",
  "h5py>=3.16.0",
  "numpy>=2.2.0",
  "pyyaml>=6.0.3",
  "openslide-python>=1.4.0",
  "openslide-bin>=4.0.0",
  "pyarrow>=19.0.0",
  "huggingface-hub>=0.30.0",
  "safetensors>=0.6.0",
  "wandb>=0.20.0",
  "scikit-learn>=1.8.0",
  "scikit-survival>=0.27.0",
  "timm>=1.0.27",
]

[dependency-groups]
gpuaug = ["kornia==0.8.3"]
simd = ["pillow-simd==12.1.1.post0"]
pillow = ["pillow"]

[tool.uv]
package = false
default-groups = ["gpuaug", "simd"]
# Select one PIL provider through groups instead of transitive requirements.
exclude-dependencies = [
  { package = { name = "torchvision" }, dependencies = ["pillow"] },
  { package = { name = "openslide-python" }, dependencies = ["pillow"] },
]
conflicts = [[{ group = "simd" }, { group = "pillow" }]]
no-binary-package = ["pillow-simd"]
config-settings-package = { pillow-simd = { tiff = "enable" } }

[tool.uv.extra-build-variables]
pillow-simd = { CC = "cc -mavx2", CFLAGS = "-O3 -DNDEBUG" }

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
